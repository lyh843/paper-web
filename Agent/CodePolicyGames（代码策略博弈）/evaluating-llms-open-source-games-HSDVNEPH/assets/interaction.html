<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合作标签与时域</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;color:#1e293b;background:#f7fafc;font:16px/1.65 system-ui,sans-serif}h1{font-size:22px;line-height:1.4;margin:0 0 12px}p{margin:10px 0}.tag{font-size:12px;color:#526477;letter-spacing:.06em}label{display:inline-flex;gap:8px;align-items:center;margin:6px 14px 8px 0;flex-wrap:wrap}input,select,button{font:inherit;max-width:100%;border:1px solid #a2b3c5;border-radius:5px;padding:6px;background:white;color:inherit}input[type=number]{width:78px}input[type=range]{width:180px}button{cursor:pointer;margin:4px}button:hover{background:#e7f0fa}:focus-visible{outline:3px solid #a35200;outline-offset:3px}table{width:100%;border-collapse:collapse;background:white;margin:12px 0}th,td{text-align:left;padding:7px 10px;border:1px solid #d6e0e9}th{font-size:14px;background:#e9f0f7}.result{padding:12px;border-left:4px solid #2563a0;background:#e7f1fa;margin:12px 0}.fine{font-size:13px;color:#526477}.trace{display:flex;flex-wrap:wrap;gap:5px}.cell{padding:5px 9px;background:#d9eee4;border:1px solid #75a18f;font-size:13px}.cell.defect{background:#fff0d9;border-color:#bb8b45}pre{padding:10px;background:#e9eef3;overflow:auto;font-size:13px;white-space:pre-wrap}.tablewrap{overflow:auto}noscript{display:block;border:1px solid #b08030;padding:10px}@media(max-width:480px){body{padding:14px}h1{font-size:19px}th,td{padding:6px;font-size:13px}}</style><body><main>
<div class="tag">构造教学程序 · 精确规则轨迹 · 非SPARC实测样本</div><h1>“前10轮都合作”能说明多少</h1>
<label>程序 <select id="rule"><option value="late">前10轮C，第11轮起D</option><option value="all">每轮合作C</option><option value="tft">Tit-for-Tat</option></select></label>
<label>检查轮数 <input id="horizon" type="range" min="1" max="50" value="10"><output id="count">10</output></label>
<p>对手始终合作。第1轮编号为1；程序内已有历史长度从0开始。</p><pre id="code"></pre><div id="trace" class="trace" aria-label="逐轮动作"></div><div id="result" class="result" aria-live="polite"></div>
<p class="fine">C=合作，D=背叛；蓝绿色／棕色同时以字母区分。一个程序通过当前有限时域标签，不证明它对所有对手、未来时刻或所有随机路径都合作。</p>
<noscript>交互需JavaScript。主阅读页保留所有关键事实与静态表格；此处不提供额外必读证据。</noscript></main><script>
const code={late:"return 'C' if len(my_history) < 10 else 'D'",all:"return 'C'",tft:"return opp_history[-1] if opp_history else 'C'"};function render(){const r=document.getElementById('rule').value,n=Number(document.getElementById('horizon').value),a=Array.from({length:n},(_,i)=>r==='late'&&i>=10?'D':'C');document.getElementById('count').value=n;document.getElementById('code').textContent=code[r];document.getElementById('trace').innerHTML=a.map((v,i)=>`<span class="cell ${v==='D'?'defect':''}">${i+1}: ${v}</span>`).join('');document.getElementById('result').textContent='在这 '+n+' 轮中是否每轮合作：'+(a.every(x=>x==='C')?'是。':'否。')+(r==='late'?' 第11轮是触发点，增加观察时域会改变标签。':' 只对总合作对手进行了这个有限检查，不代表任意情况下的行为。')}document.getElementById('rule').addEventListener('change',render);document.getElementById('horizon').addEventListener('input',render);render();
</script></body></html>

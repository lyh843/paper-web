<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAArena反馈预算</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;color:#1e293b;background:#f7fafc;font:16px/1.65 system-ui,sans-serif}h1{font-size:22px;line-height:1.4;margin:0 0 12px}p{margin:10px 0}.tag{font-size:12px;color:#526477;letter-spacing:.06em}label{display:inline-flex;gap:8px;align-items:center;margin:6px 14px 8px 0;flex-wrap:wrap}input,select,button{font:inherit;max-width:100%;border:1px solid #a2b3c5;border-radius:5px;padding:6px;background:white;color:inherit}input[type=number]{width:78px}input[type=range]{width:180px}button{cursor:pointer;margin:4px}button:hover{background:#e7f0fa}:focus-visible{outline:3px solid #a35200;outline-offset:3px}table{width:100%;border-collapse:collapse;background:white;margin:12px 0}th,td{text-align:left;padding:7px 10px;border:1px solid #d6e0e9}th{font-size:14px;background:#e9f0f7}.result{padding:12px;border-left:4px solid #2563a0;background:#e7f1fa;margin:12px 0}.fine{font-size:13px;color:#526477}.trace{display:flex;flex-wrap:wrap;gap:5px}.cell{padding:5px 9px;background:#d9eee4;border:1px solid #75a18f;font-size:13px}.cell.defect{background:#fff0d9;border-color:#bb8b45}pre{padding:10px;background:#e9eef3;overflow:auto;font-size:13px;white-space:pre-wrap}.tablewrap{overflow:auto}noscript{display:block;border:1px solid #b08030;padding:10px}@media(max-width:480px){body{padding:14px}h1{font-size:19px}th,td{padding:6px;font-size:13px}}</style><body><main>
<div class="tag">预算算术 + 原Tables7–8 · 不推算未报告成绩</div><h1>同样128单位，不同反馈机会</h1>
<label>每次请求对手数 <select id="batch"><option>1</option><option>2</option><option selected>4</option><option>8</option></select></label>
<div id="opportunities" class="result" aria-live="polite"></div><p class="fine">假设每次请求都满批。实际编辑次数由agent决定；以下Elo是原Table8报告的独立消融结果，不是由机会数预测。</p>
<table><thead><tr><th>游戏</th><th>该批量Elo</th><th>rank</th></tr></thead><tbody id="brows"></tbody></table>
<label>查看反馈组 <select id="feedback"><option value="dense">密集重放</option><option value="binary">二元胜／非胜</option></select></label>
<table><thead><tr><th>游戏</th><th>原Table7 Elo</th><th>rank</th></tr></thead><tbody id="frows"></tbody></table><p class="fine">两张表来自不同消融运行，不可混拼为一条训练曲线。全池评分另有16次；不是全流程只有128场游戏。</p>
<noscript>交互需JavaScript。主阅读页保留所有关键事实与静态表格；此处不提供额外必读证据。</noscript></main><script>
const names=['Pacman','AntWar','Miracle'],b={1:[[2040.6,5],[1130.2,9],[1338.7,45]],2:[[2196.3,2],[1433.4,5],[1491.2,19]],4:[[2703.9,1],[1208.7,8],[1518.7,16]],8:[[2160.4,2],[1118.7,9],[1465.3,23]]},f={dense:[[2236.1,1],[1118.7,9],[1528.2,15]],binary:[[1710.1,11],[880.6,22],[1461.1,23]]};function rows(d){return d.map((v,i)=>`<tr><td>${names[i]}</td><td>${v[0].toFixed(1)}</td><td>${v[1]}</td></tr>`).join('')}function render(){const batch=Number(document.getElementById('batch').value),fb=document.getElementById('feedback').value;document.getElementById('opportunities').textContent='128 ÷ '+batch+' = '+(128/batch)+' 次满批反馈请求机会。批量增加覆盖面，也减少在反馈后修订再测的机会。';document.getElementById('brows').innerHTML=rows(b[batch]);document.getElementById('frows').innerHTML=rows(f[fb])}document.getElementById('batch').addEventListener('change',render);document.getElementById('feedback').addEventListener('change',render);render();
</script></body></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Climbing Game响应检查</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;color:#1e293b;background:#f7fafc;font:16px/1.65 system-ui,sans-serif}h1{font-size:22px;line-height:1.4;margin:0 0 12px}p{margin:10px 0}.tag{font-size:12px;color:#526477;letter-spacing:.06em}label{display:inline-flex;gap:8px;align-items:center;margin:6px 14px 8px 0;flex-wrap:wrap}input,select,button{font:inherit;max-width:100%;border:1px solid #a2b3c5;border-radius:5px;padding:6px;background:white;color:inherit}input[type=number]{width:78px}input[type=range]{width:180px}button{cursor:pointer;margin:4px}button:hover{background:#e7f0fa}:focus-visible{outline:3px solid #a35200;outline-offset:3px}table{width:100%;border-collapse:collapse;background:white;margin:12px 0}th,td{text-align:left;padding:7px 10px;border:1px solid #d6e0e9}th{font-size:14px;background:#e9f0f7}.result{padding:12px;border-left:4px solid #2563a0;background:#e7f1fa;margin:12px 0}.fine{font-size:13px;color:#526477}.trace{display:flex;flex-wrap:wrap;gap:5px}.cell{padding:5px 9px;background:#d9eee4;border:1px solid #75a18f;font-size:13px}.cell.defect{background:#fff0d9;border-color:#bb8b45}pre{padding:10px;background:#e9eef3;overflow:auto;font-size:13px;white-space:pre-wrap}.tablewrap{overflow:auto}noscript{display:block;border:1px solid #b08030;padding:10px}@media(max-width:480px){body{padding:14px}h1{font-size:19px}th,td{padding:6px;font-size:13px}}</style><body><main>
<div class="tag">教学计算 · 原Fig.1矩阵 · 不调用LLM</div><h1>对手变了，哪一个动作更好</h1>
<p>输入对手三个动作的非负权重，自动归一化为概率。计算我方每个纯动作的单人期望收益，不是PIBR训练曲线。</p>
<div><label>动作0 <input id="w0" type="number" min="0" max="100" value="100"></label><label>动作1 <input id="w1" type="number" min="0" max="100" value="0"></label><label>动作2 <input id="w2" type="number" min="0" max="100" value="0"></label></div>
<div><button data-weights="100,0,0">对手总选0</button><button data-weights="0,100,0">对手总选1</button><button data-weights="0,0,100">对手总选2</button><button data-weights="1,1,1">均匀混合</button></div>
<div id="prob" class="fine"></div><table><thead><tr><th>我方动作</th><th>精确加权收益</th><th>是否最佳响应</th></tr></thead><tbody id="rows"></tbody></table><div id="result" class="result" aria-live="polite"></div>
<p class="fine">矩阵为[[11,−30,0],[−30,7,0],[0,6,5]]，每格是双方各自收益。只枚举这个矩阵的三个动作，不证明LLM对任意程序都能求出最优响应。</p>
<noscript>交互需JavaScript。主阅读页保留所有关键事实与静态表格；此处不提供额外必读证据。</noscript></main><script>
const M=[[11,-30,0],[-30,7,0],[0,6,5]], inputs=[0,1,2].map(i=>document.getElementById('w'+i));
function render(){let w=inputs.map(e=>Math.max(0,Number(e.value)||0)),s=w.reduce((a,b)=>a+b,0);if(!s){document.getElementById('rows').innerHTML='';document.getElementById('prob').textContent='';document.getElementById('result').textContent='至少一个权重须大于0；没有分布时不计算。';return}let p=w.map(v=>v/s),v=M.map(r=>r.reduce((a,b,j)=>a+b*p[j],0)),best=Math.max(...v),choices=v.map((u,i)=>Math.abs(u-best)<1e-9?i:null).filter(i=>i!==null);document.getElementById('prob').textContent='归一化概率：'+p.map(x=>x.toFixed(3)).join(' / ');document.getElementById('rows').innerHTML=v.map((u,i)=>`<tr><td>${i}</td><td>${u.toFixed(3)}</td><td>${choices.includes(i)?'是':'否'}</td></tr>`).join('');document.getElementById('result').textContent='最佳纯响应：动作 '+choices.join('、')+'；其单人期望收益 '+best.toFixed(3)+'。若双方获得同格收益，总福利为 '+(2*best).toFixed(3)+'。'}
inputs.forEach(e=>e.addEventListener('input',render));document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{b.dataset.weights.split(',').forEach((v,i)=>inputs[i].value=v);render()}));render();
</script></body></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSRO指标比较</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;color:#1e293b;background:#f7fafc;font:16px/1.65 system-ui,sans-serif}h1{font-size:22px;line-height:1.4;margin:0 0 12px}p{margin:10px 0}.tag{font-size:12px;color:#526477;letter-spacing:.06em}label{display:inline-flex;gap:8px;align-items:center;margin:6px 14px 8px 0;flex-wrap:wrap}input,select,button{font:inherit;max-width:100%;border:1px solid #a2b3c5;border-radius:5px;padding:6px;background:white;color:inherit}input[type=number]{width:78px}input[type=range]{width:180px}button{cursor:pointer;margin:4px}button:hover{background:#e7f0fa}:focus-visible{outline:3px solid #a35200;outline-offset:3px}table{width:100%;border-collapse:collapse;background:white;margin:12px 0}th,td{text-align:left;padding:7px 10px;border:1px solid #d6e0e9}th{font-size:14px;background:#e9f0f7}.result{padding:12px;border-left:4px solid #2563a0;background:#e7f1fa;margin:12px 0}.fine{font-size:13px;color:#526477}.trace{display:flex;flex-wrap:wrap;gap:5px}.cell{padding:5px 9px;background:#d9eee4;border:1px solid #75a18f;font-size:13px}.cell.defect{background:#fff0d9;border-color:#bb8b45}pre{padding:10px;background:#e9eef3;overflow:auto;font-size:13px;white-space:pre-wrap}.tablewrap{overflow:auto}noscript{display:block;border:1px solid #b08030;padding:10px}@media(max-width:480px){body{padding:14px}h1{font-size:19px}th,td{padding:6px;font-size:13px}}</style><body><main>
<div class="tag">原Table1均值重排 · 非新实验</div><h1>“最强”取决于你想防什么</h1>
<label>排序指标 <select id="metric"><option value="ret">平均收益 PopReturn ↑</option><option value="exp">群体内可利用性 PopExpl ↓</option><option value="agg">综合分 AggScore ↑</option></select></label>
<p class="fine">此视图仅按报告均值排序，误差项见主文原表；没有置信度排序或显著性声明。</p>
<div class="tablewrap"><table><thead><tr><th>方法</th><th>平均收益 ↑</th><th>最差损失 ↓</th><th>综合分 ↑</th></tr></thead><tbody id="rows"></tbody></table></div><div class="result" id="result" aria-live="polite"></div>
<p>平均收益高可以与某个严重弱点并存。有限群体内的最差损失小，也不代表任何新对手都无法利用。</p><p class="fine">RRPS每局1000拳。对比者Gemma3 27B在运行时预测动作，CSRO在开发时生成程序；比较对象形态不同。</p>
<noscript>交互需JavaScript。主阅读页保留所有关键事实与静态表格；此处不提供额外必读证据。</noscript></main><script>
const data=[{name:'CSRO AlphaEvolve',ret:50.5,exp:25.2,agg:25.4},{name:'CSRO线性／代码Top5',ret:159.8,exp:37.7,agg:122.1},{name:'CSRO一次／摘要',ret:130.2,exp:66.7,agg:63.5},{name:'Gemma3 27B动作预测',ret:193.2,exp:67.2,agg:126.0},{name:'PSRO-IMPALA',ret:-108.9,exp:423.2,agg:-532.1}];
function render(){const k=document.getElementById('metric').value,sorted=[...data].sort((a,b)=>k==='exp'?a[k]-b[k]:b[k]-a[k]);document.getElementById('rows').innerHTML=sorted.map((d,i)=>`<tr${i===0?' style="background:#e0eee8"':''}><td>${i===0?'① ':''}${d.name}</td><td>${d.ret.toFixed(1)}</td><td>${d.exp.toFixed(1)}</td><td>${d.agg.toFixed(1)}</td></tr>`).join('');document.getElementById('result').textContent=k==='exp'?'这个群体的均值指标下，AlphaEvolve最少被最不利bot利用；代价是利用弱bot的平均回报较低。':k==='agg'?'综合分优先时，动作预测agent与线性细化代码版接近。综合分是人为设定的平均–最差权衡，不是均衡证明。':'平均回报优先时，动作预测agent领先。但它的最差损失高于两种细化CSRO；换一个问题，排序就变。'}document.getElementById('metric').addEventListener('change',render);render();
</script></body></html>
